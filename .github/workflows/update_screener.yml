name: Update CEDEAR Screener

on:
  schedule:
    # 23:00 UTC = 20:00 ART, weekdays only (after US market close)
    - cron: '0 23 * * 1-5'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  update-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch data
        run: python generate_data.py

      - name: Build HTML screener
        run: python build_screener.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cedear_screener.html data/screener_raw.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto-update screener $(date -u +'%Y-%m-%d')"
          git push
